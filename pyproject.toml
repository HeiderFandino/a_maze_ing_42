[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation package for the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]

authors = [
    { name = "hfandino" },
    { name = "mmarches" }
]

[tool.setuptools.packages.find]
include = ["mazegen*"]
